name: STAGE

on:
  push:
    branches: [ "stage" ]


env:
  REGISTRY: lhidalgov
  IMAGE_NAME: kubelabs_demo
  OPS_REPO: luhidalg/ops
  OPS_BRANCH: main

jobs:
  build:
    runs-on: ubuntu-latest
  
  steps:
    - uses: actions/checkout@v3 # checkout github code https://github.com/marketplace/actions/checkout
      name: Checkout code
      with:
        fetch-depth: 0 # fetch tags Number of commits to fetch. 0 indicates all history for all branches and tags.


    - name: Login to Docker Hub # https://github.com/marketplace/actions/docker-login
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}


    - name: Build & push # https://github.com/marketplace/actions/build-and-push-docker-images
      uses: docker/build-push-action@v3
      with: 
        push: true
        tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest ## Secrets from DEV repo