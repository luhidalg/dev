name: STAGE

on:
  push:
    branches: [ "stage" ]

env:
  REGISTRY: lhidalgov
  IMAGE_NAME: kubelabs_demo
  OPS_REPO: luhidalg/ops
  OPS_BRANCH: main

jobs:
  build:
    runs-on: ubuntu-latest

    outputs:
      RELEASE_VERSION: ${{ steps.tagVersion.outputs.RELEASE_VERSION }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v3 # checkout github code https://github.com/marketplace/actions/checkout
        with:
          fetch-depth: 0

      - name: Get tag version
        #run : echo "RELEASE_VERSION=$( git rev-parse --short HEAD )" >> $GITHUB_ENV
        run: |
          RELEASE_VERSION=$(git tag --sort=-creatordate | head -1)

          if [ -z "$RELEASE_VERSION" ]; then
            echo "No Git tag was found"
            exit 1
          fi

          echo "RELEASE_VERSION=$RELEASE_VERSION" >> "$GITHUB_ENV"

      - name: Show tag version 
        id: tagVersion
        run : |
          echo ${{ env.RELEASE_VERSION }}

          echo "RELEASE_VERSION=${{ env.RELEASE_VERSION }}" >> $GITHUB_OUTPUT

      - name: Login to Docker Hub # https://github.com/marketplace/actions/docker-login
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push # https://github.com/marketplace/actions/build-and-push-docker-images
        uses: docker/build-push-action@v3
        with:
          context: ./kubernetes-cicd-web
          file: ./kubernetes-cicd-web/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.RELEASE_VERSION }}

  deploy:
    name: deploy
    runs-on: ubuntu-latest
    needs: build


    env:
      VERSION: ${{ needs.build.outputs.RELEASE_VERSION }}


    steps:
      - name : Checkout OPS code
        uses: actions/checkout@v3
        with:
          repository: ${{ env.OPS_REPO }}
          token: ${{ secrets.OPS_TOKEN }} # PAT -- Personal access token 

      - name: Setup Kustomize
        uses: imranismail/setup-kustomize@v2
        with:
          kustomize-version: "3.6.1"
      
      - name: Update K8s resources
        run: |
          cd web-app/overlays/stage

          kustomize edit set image KUSTOMIZED-INPUT=${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ env.VERSION }}

          kustomize build . > kustomized-apps.yml
          cat kustomized-apps.yml
      
      - name: Commit files
        run: |
           git config --local user.email "deploy-bot@storylabs.dev"
           git config --local user.name "Web deploy-Bot"

           git add web-app/overlays/stage/kustomization.yaml
          
           if git diff --cached --quiet; then
             echo "OPS already contains image version ${{ env.VERSION }}"
             exit 0
           fi

           git commit -m "Deploy stage image ${{ env.VERSION }}"
           git push origin ${{ env.OPS_BRANCH }}

#           git add .
#           git commit -m "New image version ${{ env.OPS_BRANCH }}"
#           git push --force origin ${{ env.OPS_BRANCH }}
