name: STAGE

on:
  push:
    branches: [ "stage" ]

env:
  REGISTRY: lhidalgov
  IMAGE_NAME: kubelabs_demo
  OPS_REPO: luhidalg/ops
  OPS_BRANCH: main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3 # checkout github code https://github.com/marketplace/actions/checkout
        with:
          fetch-depth: 0

      - name: Get tag version
        run : echo "RELEASE_VERSION=$( git rev-parse --short HEAD )" >> $GITHUB_ENV

      - name: show tag version 
        run : echo ${{ env.RELEASE_VERSION }}

      - name: Login to Docker Hub # https://github.com/marketplace/actions/docker-login
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push # https://github.com/marketplace/actions/build-and-push-docker-images
        uses: docker/build-push-action@v3
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.RELEASE_VERSION }}